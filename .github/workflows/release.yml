name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-macos:
    name: Build macOS release
    runs-on: macos-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install frontend dependencies
        run: npm ci

      - name: Inject updater public key
        env:
          TAURI_UPDATER_PUBKEY: ${{ secrets.TAURI_UPDATER_PUBKEY }}
        run: node -e "const fs=require('fs'); const path='src-tauri/tauri.conf.json'; const key=process.env.TAURI_UPDATER_PUBKEY; if(!key) throw new Error('Missing TAURI_UPDATER_PUBKEY secret'); fs.writeFileSync(path, fs.readFileSync(path, 'utf8').replace('__TAURI_UPDATER_PUBKEY__', key));"

      - name: Prefer system xattr
        run: echo "/usr/bin" >> "$GITHUB_PATH"

      # 公网下载的 macOS app 必须使用 Developer ID 证书签名，ad-hoc 签名无法通过 Gatekeeper。
      - name: Import Apple Developer ID certificate
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          test -n "$APPLE_CERTIFICATE" || { echo "Missing APPLE_CERTIFICATE secret"; exit 1; }
          test -n "$APPLE_CERTIFICATE_PASSWORD" || { echo "Missing APPLE_CERTIFICATE_PASSWORD secret"; exit 1; }
          test -n "$KEYCHAIN_PASSWORD" || { echo "Missing KEYCHAIN_PASSWORD secret"; exit 1; }

          echo "$APPLE_CERTIFICATE" | base64 --decode > certificate.p12
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security set-keychain-settings -t 3600 -u build.keychain
          security import certificate.p12 -k build.keychain -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" build.keychain
          security find-identity -v -p codesigning build.keychain

      # Tauri notarization 需要明确传入 Developer ID Application 证书名称。
      - name: Resolve Developer ID identity
        run: |
          CERT_INFO=$(security find-identity -v -p codesigning build.keychain | grep "Developer ID Application" | head -n 1 || true)
          test -n "$CERT_INFO" || { echo "Missing Developer ID Application identity in imported certificate"; exit 1; }
          CERT_ID=$(echo "$CERT_INFO" | awk -F'"' '{print $2}')
          echo "APPLE_SIGNING_IDENTITY=$CERT_ID" >> "$GITHUB_ENV"

      # 缺少 Apple notarization 凭据时直接失败，避免继续发布用户打不开的安装包。
      - name: Validate Apple notarization secrets
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          test -n "$APPLE_ID" || { echo "Missing APPLE_ID secret"; exit 1; }
          test -n "$APPLE_PASSWORD" || { echo "Missing APPLE_PASSWORD secret"; exit 1; }
          test -n "$APPLE_TEAM_ID" || { echo "Missing APPLE_TEAM_ID secret"; exit 1; }

      # 由 Tauri 统一完成签名、公证、Release 资产上传和 updater manifest 生成。
      - name: Build notarized Tauri release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ env.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_UPDATER_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_UPDATER_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: Codex Account Switcher ${{ github.ref_name }}
          releaseBody: |
            macOS installation packages and updater metadata are attached below.

            The app checks this release's latest.json for signed updates.
          includeUpdaterJson: true
          releaseDraft: false
          prerelease: false
