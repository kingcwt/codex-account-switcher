name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-macos:
    name: Build macOS release
    runs-on: macos-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install frontend dependencies
        run: npm ci

      - name: Inject updater public key
        env:
          TAURI_UPDATER_PUBKEY: ${{ secrets.TAURI_UPDATER_PUBKEY }}
        run: node -e "const fs=require('fs'); const path='src-tauri/tauri.conf.json'; const key=process.env.TAURI_UPDATER_PUBKEY; if(!key) throw new Error('Missing TAURI_UPDATER_PUBKEY secret'); fs.writeFileSync(path, fs.readFileSync(path, 'utf8').replace('__TAURI_UPDATER_PUBKEY__', key));"

      - name: Prefer system xattr
        run: echo "/usr/bin" >> "$GITHUB_PATH"

      # 先让 Tauri 生成原始 app/dmg/updater 产物，后面再按参考项目方式重签和重打包。
      - name: Build unsigned Tauri bundles
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_UPDATER_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_UPDATER_PRIVATE_KEY_PASSWORD }}
        run: npm run tauri -- build --bundles app,dmg --no-sign

      # 清理 bundle 扩展属性、ad-hoc 重签 app，并用签好的 app 重做 DMG/updater 压缩包。
      - name: Re-sign macOS app and rebuild packages
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_UPDATER_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_UPDATER_PRIVATE_KEY_PASSWORD }}
        run: node scripts/sign-and-package-mac.mjs aarch64

      # latest.json 必须使用重签后的 updater 包签名，否则应用内更新校验会失败。
      - name: Generate updater manifest
        run: node scripts/generate-updater-manifest.mjs --tag "${{ github.ref_name }}" --repository "${{ github.repository }}" --arch aarch64 --output latest.json

      # 无 Apple Developer ID 时，浏览器下载会加 quarantine；安装脚本用命令行下载并清理隔离属性。
      - name: Generate macOS install script
        run: node scripts/generate-macos-install-script.mjs --tag "${{ github.ref_name }}" --repository "${{ github.repository }}" --arch aarch64 --output install-macos.sh

      # 发布 updater 包、签名、manifest 和命令行安装脚本；DMG 不上传，避免用户浏览器下载后误点触发 Gatekeeper。
      - name: Publish GitHub Release assets
        uses: softprops/action-gh-release@v2
        with:
          name: Codex Account Switcher ${{ github.ref_name }}
          body: |
            macOS updater artifacts and install script are attached below.

            Install with:
            curl -fsSL https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/install-macos.sh | bash
          draft: false
          prerelease: false
          files: |
            src-tauri/target/release/bundle/macos/*.app.tar.gz
            src-tauri/target/release/bundle/macos/*.app.tar.gz.sig
            latest.json
            install-macos.sh
