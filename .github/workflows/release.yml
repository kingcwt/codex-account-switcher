name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-macos:
    name: Build macOS release
    runs-on: macos-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install frontend dependencies
        run: npm ci

      - name: Inject updater public key
        env:
          TAURI_UPDATER_PUBKEY: ${{ secrets.TAURI_UPDATER_PUBKEY }}
        run: node -e "const fs=require('fs'); const path='src-tauri/tauri.conf.json'; const key=process.env.TAURI_UPDATER_PUBKEY; if(!key) throw new Error('Missing TAURI_UPDATER_PUBKEY secret'); fs.writeFileSync(path, fs.readFileSync(path, 'utf8').replace('__TAURI_UPDATER_PUBKEY__', key));"

      - name: Prefer system xattr
        run: echo "/usr/bin" >> "$GITHUB_PATH"

      # 先让 Tauri 生成原始 app/dmg/updater 产物，后面再按已验证项目的方式重签和重打包。
      - name: Build unsigned Tauri bundles
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_UPDATER_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_UPDATER_PRIVATE_KEY_PASSWORD }}
        run: npm run tauri -- build --bundles app,dmg --no-sign

      # 重新清理扩展属性、ad-hoc 签名 app，并用签好的 app 重做 DMG/updater 压缩包。
      - name: Re-sign macOS app and rebuild packages
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_UPDATER_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_UPDATER_PRIVATE_KEY_PASSWORD }}
        run: node scripts/sign-and-package-mac.mjs aarch64

      # latest.json 必须使用重签后的 updater 包签名，否则应用内更新校验会失败。
      - name: Generate updater manifest
        run: node scripts/generate-updater-manifest.mjs --tag "${{ github.ref_name }}" --repository "${{ github.repository }}" --arch aarch64 --output latest.json

      # 发布最终 DMG、updater 包、签名和 manifest，供网页下载和应用内更新共用。
      - name: Publish GitHub Release assets
        uses: softprops/action-gh-release@v2
        with:
          name: Codex Account Switcher ${{ github.ref_name }}
          body: |
            macOS installation packages and updater metadata are attached below.

            The app checks this release's latest.json for signed updates.
          draft: false
          prerelease: false
          files: |
            src-tauri/target/release/bundle/dmg/*.dmg
            src-tauri/target/release/bundle/macos/*.app.tar.gz
            src-tauri/target/release/bundle/macos/*.app.tar.gz.sig
            latest.json
